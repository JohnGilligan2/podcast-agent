[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-agent"
version = "1.0.0"
description = "Agentic podcast summariser, show-notes writer and fact-checker built on Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic==2.6.0",
    "pydantic>=2.7,<3",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
otel = [
    "opentelemetry-sdk>=1.40,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.40,<2",
]

[project.scripts]
podcast-agent = "podcast_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
