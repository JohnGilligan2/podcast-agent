[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-agent"
version = "0.2.0"
description = "Agentic podcast summariser, show-notes writer and fact-checker built on Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic==2.6.0",
    "pydantic>=2.7,<3",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
gui = ["streamlit>=1.40,<2"]
otel = [
    "opentelemetry-sdk>=1.40,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.40,<2",
]

[project.scripts]
podcast-agent = "podcast_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007"]
