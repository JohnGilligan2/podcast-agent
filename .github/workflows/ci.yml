# Every pull request: lint, unit + GUI tests, and a free check of the golden-set scorer. Any failure blocks
# the merge (make "ci" a required check in the branch protection rules for develop and main).
#
# The LIVE golden-set run calls Claude (about $1.20 a run), so it runs only when asked:
#   - add the `run-golden` label to a pull request (one label = one run; the label is removed afterwards), or
#   - Actions -> ci -> Run workflow, with "Run the live golden set" ticked.
# It also needs the ANTHROPIC_API_KEY repository secret.
name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      live_golden:
        description: Run the live golden set against Claude (about $1.20)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write   # to post the regression report and remove the run-golden label

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,gui]"
      - name: Lint
        run: ruff check src tests
      - name: Unit, agent-loop and GUI smoke tests (scripted model, no API key)
        run: pytest -q

  golden-set:
    # Always: score the last release's committed run (free). On request: run the golden episodes live
    # against Claude and compare with that release (see the header for how to ask).
    runs-on: ubuntu-latest
    needs: test
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LIVE: ${{ secrets.ANTHROPIC_API_KEY != '' && (inputs.live_golden || contains(github.event.pull_request.labels.*.name, 'run-golden')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Score the committed release run (checks the scorer itself, free)
        run: python -m podcast_agent eval examples/sample_run
      - name: Live golden set skipped
        if: env.LIVE != 'true'
        run: echo "Live golden set not requested. Add the run-golden label to the PR to run it (about \$1.20)."
      - name: Run the golden episodes
        if: env.LIVE == 'true'
        run: python -m podcast_agent run data/transcripts data/samples --out golden_run --no-store
        continue-on-error: true   # the eval below decides pass or fail
      - name: Compare with the last release
        if: env.LIVE == 'true'
        run: python -m podcast_agent eval golden_run --baseline examples/sample_run --md regression.md
      - name: Post the regression report
        if: always() && env.LIVE == 'true' && hashFiles('regression.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat regression.md >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file regression.md --edit-last \
              || gh pr comment "${{ github.event.pull_request.number }}" --body-file regression.md
          fi
      - uses: actions/upload-artifact@v4
        if: always() && env.LIVE == 'true'
        with:
          name: golden-run
          path: golden_run/
      - name: Remove the run-golden label (one label = one paid run)
        if: always() && env.LIVE == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --remove-label run-golden || true
