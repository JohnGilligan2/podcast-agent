# Every pull request: lint, unit + GUI tests, and the golden-set regression. Any failure blocks the merge
# (make "ci" a required check in the branch protection rules for develop and main).
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # to post the regression report on the PR

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,gui]"
      - name: Lint
        run: ruff check src tests
      - name: Unit, agent-loop and GUI smoke tests (scripted model, no API key)
        run: pytest -q

  golden-set:
    # Live run of the golden episodes against Claude, compared with the last release's committed run.
    # Runs only when the repository has an ANTHROPIC_API_KEY secret (costs about $1.20 per run).
    runs-on: ubuntu-latest
    needs: test
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Score the committed release run (checks the scorer itself, free)
        run: python -m podcast_agent eval examples/sample_run
      - name: Run the golden episodes
        if: env.ANTHROPIC_API_KEY != ''
        run: python -m podcast_agent run data/transcripts data/samples --out golden_run --no-store
        continue-on-error: true   # the eval below decides pass or fail
      - name: Compare with the last release
        if: env.ANTHROPIC_API_KEY != ''
        run: python -m podcast_agent eval golden_run --baseline examples/sample_run --md regression.md
      - name: Post the regression report
        if: always() && env.ANTHROPIC_API_KEY != '' && hashFiles('regression.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat regression.md >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file regression.md --edit-last \
              || gh pr comment "${{ github.event.pull_request.number }}" --body-file regression.md
          fi
      - uses: actions/upload-artifact@v4
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: golden-run
          path: golden_run/
