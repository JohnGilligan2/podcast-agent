# On a version tag (v0.1.0, v0.2.0 ...): build the image, push it to the registry tagged with the
# version, and write that tag into the Helm values. Argo CD watches the chart on main and syncs it.
# Rollback = revert that commit (or set image.tag back); Argo CD syncs the previous version.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write     # commit the new image tag to the Helm values on main
  packages: write     # push to ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            EXTRAS=gui
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/podcast-agent:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/podcast-agent:latest
      - name: Point the Helm chart at the new image
        run: |
          git fetch origin main && git checkout main
          sed -i "s/^  tag: .*/  tag: \"${{ steps.v.outputs.version }}\"/" deploy/helm/podcast-agent/values.yaml
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git commit -am "release ${{ github.ref_name }}: image tag" && git push origin main || echo "tag already set"
