{{- if .Values.gui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pa.name" . }}-web
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.gui.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
  template:
    metadata:
      labels:
        {{- include "pa.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      securityContext: {fsGroup: 1000}
      containers:
        - name: web
          image: {{ include "pa.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["gui", "--host", "0.0.0.0", "--port", "8501"]
          env:   # no API key: the GUI never calls Claude
            {{- include "pa.env" . | nindent 12 }}
            - {name: HOME, value: /tmp}   # Streamlit writes its config under $HOME
          ports: [{name: http, containerPort: 8501}]
          readinessProbe: {httpGet: {path: /_stcore/health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /_stcore/health, port: http}, periodSeconds: 20, failureThreshold: 3}
          {{- include "pa.security" . | nindent 10 }}
          resources:
            {{- toYaml .Values.gui.resources | nindent 12 }}
          volumeMounts:
            {{- include "pa.mounts" . | nindent 12 }}
      volumes:
        {{- include "pa.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pa.name" . }}-web
  labels:
    {{- include "pa.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
  ports: [{name: http, port: 80, targetPort: http}]
{{- if .Values.gui.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "pa.name" . }}-web
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "pa.name" . }}-web}
  minReplicas: {{ .Values.gui.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gui.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.gui.autoscaling.targetCPUUtilizationPercentage }}}}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pa.name" . }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls: [{hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.ingress.tls.secretName }}}]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ include "pa.name" . }}-web, port: {name: http}}}
{{- end }}
{{- end }}
